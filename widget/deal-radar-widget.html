<!--
  Deal Radar UK — "Latest Deals" website widget.

  This is NOT part of the Next.js app — it's a standalone snippet meant to
  be pasted into your GoDaddy Airo site's "Custom Code" / "Embed" block
  (Website Builder → the page you want it on → Add → Embed → paste this in).

  Before pasting: replace APP_URL below with your actual deployed app's
  address (e.g. "https://deal-radar-app.vercel.app") — see README section
  10 for exactly where to find it after deploying to Vercel.

  It fetches your curated deals (only ones you've reacted to in Telegram —
  never raw/unfiltered channel noise) from the app's public /api/public/deals
  endpoint and renders them as simple cards. No login, no cookies, nothing
  written back — read-only, safe to embed anywhere.
-->
<div id="deal-radar-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <p id="deal-radar-widget-status" style="color: #888; font-size: 14px;">Loading latest deals…</p>
  <div
    id="deal-radar-widget-grid"
    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;"
  ></div>
</div>

<script>
  (function () {
    // ---- The one thing you need to change --------------------------------
    var APP_URL = "https://REPLACE-WITH-YOUR-APP-URL.vercel.app";
    // ------------------------------------------------------------------------

    var statusEl = document.getElementById("deal-radar-widget-status");
    var gridEl = document.getElementById("deal-radar-widget-grid");

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    function renderDeal(deal) {
      var card = document.createElement("a");
      card.href = deal.productLink || "#";
      card.target = "_blank";
      card.rel = "noopener noreferrer nofollow sponsored";
      card.style.cssText =
        "display:block;text-decoration:none;color:inherit;border:1px solid #eee;border-radius:12px;" +
        "overflow:hidden;background:#fff;transition:box-shadow .15s ease;";
      card.onmouseenter = function () {
        card.style.boxShadow = "0 4px 16px rgba(0,0,0,0.08)";
      };
      card.onmouseleave = function () {
        card.style.boxShadow = "none";
      };

      var photoHtml = deal.photoUrl
        ? '<img src="' +
          escapeHtml(deal.photoUrl) +
          '" alt="' +
          escapeHtml(deal.itemName) +
          '" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;" loading="lazy" />'
        : '<div style="width:100%;aspect-ratio:1/1;background:#f4f4f4;"></div>';

      card.innerHTML =
        photoHtml +
        '<div style="padding:12px;">' +
        '<div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.04em;">' +
        escapeHtml(deal.retailer) +
        "</div>" +
        '<div style="font-weight:600;font-size:15px;margin:4px 0 8px;line-height:1.3;">' +
        escapeHtml(deal.itemName) +
        "</div>" +
        '<div style="display:flex;align-items:baseline;gap:8px;">' +
        '<span style="font-weight:700;font-size:16px;">' +
        escapeHtml(deal.price) +
        "</span>" +
        '<span style="text-decoration:line-through;color:#999;font-size:13px;">' +
        escapeHtml(deal.rrp) +
        "</span>" +
        "</div>" +
        '<div style="color:#1a7f37;font-size:13px;font-weight:600;margin-top:2px;">' +
        escapeHtml(deal.percentOff) +
        " off</div>" +
        (deal.sizesAvailable
          ? '<div style="color:#888;font-size:12px;margin-top:6px;">Sizes: ' +
            escapeHtml(deal.sizesAvailable) +
            "</div>"
          : "") +
        "</div>";

      return card;
    }

    fetch(APP_URL.replace(/\/$/, "") + "/api/public/deals?limit=12")
      .then(function (res) {
        return res.json();
      })
      .then(function (data) {
        var deals = (data && data.deals) || [];
        if (deals.length === 0) {
          statusEl.textContent = "No deals posted yet — check back soon.";
          return;
        }
        statusEl.style.display = "none";
        deals.forEach(function (deal) {
          gridEl.appendChild(renderDeal(deal));
        });
      })
      .catch(function () {
        statusEl.textContent = "Couldn't load deals right now — try refreshing.";
      });
  })();
</script>
